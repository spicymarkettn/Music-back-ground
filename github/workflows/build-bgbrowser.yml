name: Build BgBrowser APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Unzip BgBrowser project
        run: |
          ls -la
          unzip -o "BgBrowser (2).zip" -d .
          echo "Project files after unzip:"
          find . -maxdepth 3 -type f | sort | sed 's#^\./##' | head -200

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses

      - name: Install required Android SDK components
        run: |
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Build debug APK
        shell: bash
        run: |
          GRADLEW_PATH=$(find . -type f -name gradlew | head -n 1)
          if [ -z "$GRADLEW_PATH" ]; then
            echo "ERROR: No gradlew found after unzip."
            echo "Make sure BgBrowser.zip contains the full Android project with gradlew."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW_PATH")
          cd "$PROJECT_DIR"

          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BgBrowser-debug-apk
          path: |
            **/app/build/outputs/apk/debug/*.apk
